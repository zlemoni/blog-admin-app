<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>心记管理 · P0</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--line:#e5e7eb;--text:#1f2328;--muted:#6b7280;--accent:#2563eb}
  @media (prefers-color-scheme:dark){:root{--bg:#0b0b10;--card:#16161c;--line:#2a2a33;--text:#f4f4f5;--muted:#9ca3af}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:18px 14px 40px}
  h1{font-size:18px;margin:4px 0 2px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  button{flex:1;min-width:140px;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:600}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button:disabled{opacity:.5}
  .stage{font-size:13px;color:var(--muted);margin:10px 0 0}
  #splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;z-index:99;padding:24px;text-align:center}
  .spinner{width:44px;height:44px;border:3px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .splash-title{font-size:16px;font-weight:600}
  .splash-stage{font-size:13px;color:var(--muted);max-width:80%}
  pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;height:46vh;overflow:auto;font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;margin:10px 0 0}
</style>
</head>
<body>
<div id="splash">
  <div class="spinner"></div>
  <div class="splash-title">正在准备运行环境</div>
  <div class="splash-stage" id="splash-stage">首次启动需要解压约 500 MB，请勿退出</div>
</div>
<div class="wrap" id="main" style="display:none">
  <h1>心记管理</h1>
  <p class="sub">这一步验证：解压运行环境 → 本地跑 Astro 构建。</p>

  <div class="card">
    <div class="row" style="align-items:center">
      <span style="font-size:13px;color:var(--muted)" id="ver-text">版本 …</span>
      <button id="btn-update" style="flex:0 0 auto;min-width:auto;padding:8px 12px">检查更新</button>
    </div>
    <div id="update-box" style="display:none;margin-top:8px;font-size:13px"></div>
  </div>

  <div class="card">
    <div class="row">
      <button id="btn-install">安装环境</button>
      <button id="btn-clear">清除环境</button>
      <button id="btn-diag">自检</button>
      <button id="btn-build" class="primary">构建</button>
      <button id="btn-preview">预览</button>
    </div>
    <p class="stage" id="stage">状态：<span id="state">未知</span></p>
    <pre id="log"></pre>
  </div>
</div>
<script>
  const logEl = document.getElementById('log')
  const stateEl = document.getElementById('state')
  const btnInstall = document.getElementById('btn-install')
  const btnBuild = document.getElementById('btn-build')

  window.__log = (line) => {
    logEl.textContent += line + '\n'
    logEl.scrollTop = logEl.scrollHeight
  }
  window.__stage = (msg) => { stateEl.textContent = msg }
  window.__update = (jsonStr) => {
    try {
      const d = JSON.parse(jsonStr)
      const box = document.getElementById('update-box')
      box.style.display = 'block'
      document.getElementById('ver-text').textContent = '当前 ' + d.current
      if (d.hasUpdate) {
        box.innerHTML = '<div style="margin-bottom:6px">发现新版本 <b>' + d.latest + '</b></div>'
          + '<button id="btn-dl-mirror" style="min-width:auto;padding:8px 12px">应用内下载（镜像）</button> '
          + '<button id="btn-dl-direct" style="min-width:auto;padding:8px 12px">应用内下载（直链）</button>'
        const doDownload = (url, btn) => {
          btn.disabled = true
          btn.textContent = '下载中…'
          logEl.textContent = ''
          try { Native.downloadUpdate(url) } catch (e) { window.__log('调用失败: ' + e) }
        }
        document.getElementById('btn-dl-mirror').onclick = (e) => doDownload(d.mirror, e.target)
        document.getElementById('btn-dl-direct').onclick = (e) => doDownload(d.direct, e.target)
      } else {
        box.textContent = '已是最新版本'
      }
    } catch (e) { box.textContent = '解析失败: ' + e }
  }
  window.__updateErr = (msg) => {
    const box = document.getElementById('update-box')
    box.style.display = 'block'
    box.textContent = '检查失败: ' + msg
  }

  window.__buildDone = (code) => {
    btnBuild.disabled = false
    btnInstall.disabled = false
    window.__log('--- exit ' + code + ' ---')
  }

  try { stateEl.textContent = Native.status() } catch (e) { stateEl.textContent = '桥接失败' }

  btnInstall.onclick = () => {
    btnInstall.disabled = true
    try { Native.install() } catch (e) { window.__log('调用失败: ' + e) }
  }
  document.getElementById('btn-update').onclick = () => {
    const b = document.getElementById('btn-update')
    b.disabled = true
    try { Native.checkUpdate() } catch (e) { window.__updateErr('调用失败') }
    setTimeout(() => { b.disabled = false }, 1000)
  }
  try { document.getElementById('ver-text').textContent = '当前 ' + Native.version() } catch (e) {}

  // 启动：先装环境，成功后进主界面
  window.__envReady = () => {
    document.getElementById('splash').style.display = 'none'
    document.getElementById('main').style.display = 'block'
    stateEl.textContent = '环境就绪'
  }
  window.__envError = (msg) => {
    document.getElementById('splash-stage').textContent = '安装失败：' + msg + '（可点重试）'
    const b = document.createElement('button')
    b.textContent = '重试'
    b.style.cssText = 'margin-top:12px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--accent);color:#fff'
    b.onclick = () => location.reload()
    document.getElementById('splash').appendChild(b)
  }
  const splashStage = document.getElementById('splash-stage')
  window.__stage = (msg) => {
    stateEl.textContent = msg
    if (splashStage) splashStage.textContent = msg
  }
  try { Native.ensureEnv() } catch (e) {
    document.getElementById('splash-stage').textContent = '调用失败: ' + e
  }

  const btnDiag = document.getElementById('btn-diag')
  // 两步确认，不依赖系统弹窗
  let clearArmed = false
  let clearTimer = null
  const btnClear = document.getElementById('btn-clear')
  btnClear.onclick = () => {
    if (!clearArmed) {
      clearArmed = true
      btnClear.textContent = '再点一次确认'
      btnClear.style.borderColor = '#dc2626'
      btnClear.style.color = '#dc2626'
      clearTimeout(clearTimer)
      clearTimer = setTimeout(() => {
        clearArmed = false
        btnClear.textContent = '清除环境'
        btnClear.style.borderColor = ''
        btnClear.style.color = ''
      }, 5000)
      return
    }
    clearArmed = false
    clearTimeout(clearTimer)
    btnClear.textContent = '清除环境'
    btnClear.style.borderColor = ''
    btnClear.style.color = ''
    logEl.textContent = ''
    window.__log('开始清除环境…')
    try { Native.clearEnv() } catch (e) { window.__log('调用失败: ' + e) }
  }

  btnDiag.onclick = () => {
    btnDiag.disabled = true
    logEl.textContent = ''
    try { Native.diagnose() } catch (e) { window.__log('调用失败: ' + e) }
    setTimeout(() => { btnDiag.disabled = false }, 500)
  }
  document.getElementById('btn-preview').onclick = () => {
    try {
      Native.preview()
      const url = Native.previewUrl()
      setTimeout(() => { window.location.href = url }, 600)
    } catch (e) { window.__log('预览失败: ' + e) }
  }

  btnBuild.onclick = () => {
    btnBuild.disabled = true
    logEl.textContent = ''
    try { Native.build() } catch (e) { window.__log('调用失败: ' + e) }
  }
</script>
</body>
</html>

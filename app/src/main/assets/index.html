<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>心记管理</title>
<style>
  :root{
    --bg:#f5f5f7;
    --bg2:#e8ecf5;
    --glass:rgba(255,255,255,.62);
    --glass-strong:rgba(255,255,255,.78);
    --stroke:rgba(255,255,255,.85);
    --text:#1d1d1f;
    --muted:#6e6e73;
    --accent:#0071e3;
    --accent-soft:rgba(0,113,227,.12);
    --danger:#ff3b30;
    --good:#34c759;
    --shadow:0 12px 40px rgba(0,0,0,.10);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#000;
      --bg2:#0d1220;
      --glass:rgba(28,28,30,.62);
      --glass-strong:rgba(38,38,42,.78);
      --stroke:rgba(255,255,255,.12);
      --text:#f5f5f7;
      --muted:#98989d;
      --accent:#0a84ff;
      --accent-soft:rgba(10,132,255,.18);
      --shadow:0 12px 40px rgba(0,0,0,.55);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;color:var(--text);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(0,113,227,.18), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(255,45,85,.14), transparent 55%),
      radial-gradient(900px 600px at 50% 110%, rgba(52,199,89,.14), transparent 60%),
      linear-gradient(180deg,var(--bg),var(--bg2));
    background-attachment:fixed;
    min-height:100%;
  }
  .wrap{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px 32px}

  h1{font-size:32px;line-height:1.15;letter-spacing:-.02em;font-weight:700;margin:6px 0 2px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 18px}

  .card{
    background:var(--glass);
    -webkit-backdrop-filter:blur(30px) saturate(180%);
    backdrop-filter:blur(30px) saturate(180%);
    border:1px solid var(--stroke);
    border-radius:22px;
    padding:16px;
    margin-bottom:14px;
    box-shadow:var(--shadow);
  }
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  button{
    font:inherit;font-weight:600;font-size:15px;
    padding:12px 18px;border-radius:999px;border:1px solid transparent;
    background:var(--glass-strong);color:var(--text);
    -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
    transition:transform .16s ease,opacity .16s ease;
    flex:1;min-width:120px;
  }
  button:active{transform:scale(.97);opacity:.85}
  button:disabled{opacity:.45;transform:none}
  button.primary{background:var(--accent);color:#fff;box-shadow:0 6px 20px rgba(0,113,227,.35)}
  button.ghost{background:transparent;border-color:var(--stroke);color:var(--text)}
  button.danger{color:var(--danger)}
  button.small{flex:0 0 auto;min-width:auto;padding:9px 14px;font-size:14px}

  .verbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .ver{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

  .status{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--muted);margin-top:12px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:0 0 auto}
  .dot.good{background:var(--good);box-shadow:0 0 0 4px rgba(52,199,89,.18)}
  .dot.bad{background:var(--danger);box-shadow:0 0 0 4px rgba(255,59,48,.16)}
  .dot.run{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}

  input{
    flex:1;min-width:130px;font:inherit;font-size:14px;padding:11px 14px;border-radius:14px;
    border:1px solid var(--stroke);background:var(--glass-strong);color:var(--text);
    -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  }
  input::placeholder{color:var(--muted)}
  .filelist{max-height:38vh;overflow:auto;margin-top:10px;border-radius:14px}
  .filelist button{display:block;width:100%;text-align:left;margin-bottom:6px;
    font-weight:500;font-size:14px;padding:11px 14px}
  #editor{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;
    background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px)}
  #editor .head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  #editor .head .path{flex:1;font-size:13px;color:var(--muted);word-break:break-all}
  #editor textarea{flex:1;width:100%;border-radius:16px;border:1px solid var(--stroke);
    background:var(--glass-strong);color:var(--text);padding:12px;font:12px/1.6 ui-monospace,Menlo,monospace;
    resize:none;outline:none}
  pre{
    margin:14px 0 0;padding:14px;border-radius:16px;
    background:rgba(0,0,0,.04);border:1px solid var(--stroke);
    height:44vh;overflow:auto;white-space:pre-wrap;word-break:break-word;
    font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text);
  }
  @media (prefers-color-scheme:dark){ pre{background:rgba(255,255,255,.05)} }

  .upd{margin-top:10px;font-size:14px;display:none}
  .upd.show{display:block}
  .upd .ver-line{color:var(--muted);margin-bottom:8px}

  /* 启动遮罩 */
  #splash{
    position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;padding:28px;text-align:center;
    background:
      radial-gradient(800px 400px at 50% 0%, rgba(0,113,227,.22), transparent 60%),
      linear-gradient(180deg,var(--bg),var(--bg2));
  }
  .ring{width:46px;height:46px;border-radius:50%;
    border:3px solid rgba(127,127,127,.22);border-top-color:var(--accent);
    animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .splash-title{font-size:19px;font-weight:600;letter-spacing:-.01em}
  .splash-stage{font-size:14px;color:var(--muted);max-width:78%}
  .bar{width:min(280px,72vw);height:6px;border-radius:3px;background:rgba(127,127,127,.22);overflow:hidden}
  .bar > i{display:block;height:100%;width:0%;border-radius:3px;
    background:linear-gradient(90deg,#0a84ff,#64d2ff);transition:width .3s ease}
  .splash-hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 24px);font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div id="splash">
  <div class="ring"></div>
  <div class="splash-title">正在准备运行环境</div>
  <div class="bar"><i id="splash-bar"></i></div>
  <div class="splash-stage" id="splash-stage">首次启动需要解压约 500 MB，请勿退出</div>
  <div class="splash-hint" id="splash-elapsed">心记管理</div>
</div>

<div class="wrap" id="main" style="display:none">
  <h1>心记管理</h1>
  <p class="sub">本地构建 · 本地预览 · 发布到 Vercel</p>

  <div class="card">
    <div class="verbar">
      <span class="ver" id="ver-text">版本 …</span>
      <button class="small ghost" id="btn-update" style="flex:0 0 auto">检查更新</button>
    </div>
    <div class="upd" id="update-box"></div>
  </div>

  <div class="card">
    <div class="row">
      <button id="btn-build" class="primary">构建</button>
      <button id="btn-preview">预览</button>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="state">未知</span></div>
    <pre id="log"></pre>
  </div>

  <div class="card">
    <div class="row">
      <button class="ghost" id="btn-theme">主题文件</button>
    </div>
    <div class="filelist" id="theme-files" style="display:none"></div>
    <div class="status"><span class="dot"></span><span id="theme-hint">修改后需重新构建才会生效</span></div>
  </div>

  <div id="editor">
    <div class="head">
      <button class="small ghost" id="ed-close" style="flex:0 0 auto">关闭</button>
      <span class="path" id="ed-path"></span>
      <button class="small primary" id="ed-save" style="flex:0 0 auto">保存</button>
    </div>
    <textarea id="ed-text" spellcheck="false"></textarea>
  </div>

  <div class="card">
    <div class="row" style="margin-bottom:10px">
      <input id="vc-token" type="password" placeholder="Vercel Token" autocomplete="off">
    </div>
    <div class="row" style="margin-bottom:10px">
      <button class="ghost small" id="btn-projects" style="flex:1">获取项目列表</button>
      <button class="ghost small" id="btn-create" style="flex:1">新建项目</button>
    </div>
    <div id="proj-list" style="display:none;margin-bottom:10px"></div>
    <div class="row" style="margin-bottom:10px">
      <input id="vc-project" placeholder="项目名（可手填，或从上面选）" autocapitalize="off">
    </div>
    <div class="row" style="margin-bottom:10px">
      <input id="px-host" placeholder="代理地址（可选，如 127.0.0.1）" autocapitalize="off">
      <input id="px-port" placeholder="端口" inputmode="numeric">
    </div>
    <div class="row" style="margin-bottom:10px">
      <input id="gh-token" type="password" placeholder="GitHub Token（推送用）" autocomplete="off">
    </div>
    <div class="row" style="margin-bottom:10px">
      <input id="gh-repo" placeholder="仓库 owner/repo" autocapitalize="off">
      <input id="gh-branch" placeholder="分支" autocapitalize="off" style="max-width:110px">
    </div>
    <div class="row" style="margin-bottom:10px">
      <button class="ghost" id="btn-save">保存配置</button>
    </div>
    <div class="row">
      <button class="ghost" id="btn-deploy">发布（Vercel API）</button>
      <button class="primary" id="btn-push">推送到 GitHub</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <button class="ghost small" id="btn-diag" style="flex:1">自检</button>
      <button class="ghost small" id="btn-install" style="flex:1">安装环境</button>
      <button class="ghost small danger" id="btn-clear" style="flex:1">清除环境</button>
    </div>
  </div>
</div>

<script>
  const logEl = document.getElementById('log')
  const stateEl = document.getElementById('state')
  const dotEl = document.getElementById('dot')
  const splashStage = document.getElementById('splash-stage')
  const btnBuild = document.getElementById('btn-build')
  const btnPreview = document.getElementById('btn-preview')
  const btnDiag = document.getElementById('btn-diag')
  const btnInstall = document.getElementById('btn-install')
  const btnClear = document.getElementById('btn-clear')

  window.__log = (line) => {
    logEl.textContent += line + '\n'
    logEl.scrollTop = logEl.scrollHeight
  }

  function setTone(t) {
    dotEl.className = 'dot' + (t ? ' ' + t : '')
  }

  const t0 = Date.now()
  setInterval(() => {
    const el = document.getElementById('splash-elapsed')
    const sp = document.getElementById('splash')
    if (el && sp && sp.style.display !== 'none') {
      el.textContent = '已用 ' + Math.floor((Date.now() - t0) / 1000) + ' 秒'
    }
  }, 1000)

  window.__progress = (pct) => {
    const bar = document.getElementById('splash-bar')
    if (bar) bar.style.width = Math.max(0, Math.min(100, pct)) + '%'
  }

  window.__stage = (msg) => {
    stateEl.textContent = msg
    if (splashStage) splashStage.textContent = msg
    if (msg.startsWith('✓') || msg.indexOf('就绪') >= 0) setTone('good')
    else if (msg.startsWith('✗')) setTone('bad')
    else setTone('run')
  }

  window.__buildDone = (code) => {
    btnBuild.disabled = false
    btnPreview.disabled = false
    btnDiag.disabled = false
    btnInstall.disabled = false
  }

  // 更新
  window.__update = (jsonStr) => {
    try {
      const d = JSON.parse(jsonStr)
      const box = document.getElementById('update-box')
      document.getElementById('ver-text').textContent = '当前 ' + d.current
      box.classList.add('show')
      if (d.hasUpdate) {
        box.innerHTML = '<div class="ver-line">发现新版本 <b>' + d.latest + '</b></div>'
          + '<div class="row"><button class="small primary" id="dl1">应用内下载（镜像）</button>'
          + '<button class="small ghost" id="dl2">直链下载</button></div>'
        const go = (url, btn) => {
          btn.disabled = true; btn.textContent = '下载中…'
          logEl.textContent = ''
          try { Native.downloadUpdate(url) } catch (e) { window.__log('调用失败: ' + e) }
        }
        document.getElementById('dl1').onclick = (e) => go(d.mirror, e.target)
        document.getElementById('dl2').onclick = (e) => go(d.direct, e.target)
      } else {
        box.innerHTML = '<div class="ver-line">已是最新版本</div>'
      }
    } catch (e) {
      document.getElementById('update-box').textContent = '解析失败: ' + e
    }
  }
  window.__updateErr = (msg) => {
    const box = document.getElementById('update-box')
    box.classList.add('show')
    box.textContent = '检查失败: ' + msg
  }

  // 启动
  window.__envReady = () => {
    document.getElementById('splash').style.display = 'none'
    document.getElementById('main').style.display = 'block'
    setTone('good')
    stateEl.textContent = '环境就绪'
    loadCfg()
  }
  window.__envError = (msg) => {
    document.getElementById('splash-stage').textContent = '安装失败：' + msg
    const b = document.createElement('button')
    b.textContent = '重试'
    b.className = 'primary'
    b.style.marginTop = '14px'
    b.onclick = () => location.reload()
    document.getElementById('splash').appendChild(b)
  }

  document.getElementById('btn-update').onclick = () => {
    const b = document.getElementById('btn-update')
    b.disabled = true
    try { Native.checkUpdate() } catch (e) { window.__updateErr('调用失败') }
    setTimeout(() => { b.disabled = false }, 1200)
  }

  btnInstall.onclick = () => {
    btnInstall.disabled = true
    logEl.textContent = ''
    try { Native.install() } catch (e) { window.__log('调用失败: ' + e) }
  }

  let clearArmed = false, clearTimer = null
  btnClear.onclick = () => {
    if (!clearArmed) {
      clearArmed = true
      btnClear.textContent = '再点一次确认'
      btnClear.style.color = 'var(--danger)'
      clearTimeout(clearTimer)
      clearTimer = setTimeout(() => {
        clearArmed = false
        btnClear.textContent = '清除环境'
        btnClear.style.color = ''
      }, 5000)
      return
    }
    clearArmed = false
    clearTimeout(clearTimer)
    btnClear.textContent = '清除环境'
    btnClear.style.color = ''
    logEl.textContent = ''
    window.__log('开始清除环境…')
    try { Native.clearEnv() } catch (e) { window.__log('调用失败: ' + e) }
  }

  btnDiag.onclick = () => {
    btnDiag.disabled = true
    logEl.textContent = ''
    try { Native.diagnose() } catch (e) { window.__log('调用失败: ' + e) }
    setTimeout(() => { btnDiag.disabled = false }, 800)
  }

  function loadCfg() {
    try {
      const c = JSON.parse(Native.loadConfig())
      document.getElementById('vc-token').value = c.vercelToken || ''
      document.getElementById('vc-project').value = c.vercelProject || ''
      document.getElementById('px-host').value = c.proxyHost || ''
      document.getElementById('px-port').value = c.proxyPort || ''
      document.getElementById('gh-token').value = c.ghToken || ''
      document.getElementById('gh-repo').value = c.ghRepo || ''
      document.getElementById('gh-branch').value = c.ghBranch || 'main'
    } catch (e) {}
  }

  window.__projects = (jsonStr) => {
    const box = document.getElementById('proj-list')
    box.style.display = 'block'
    let list = []
    try { list = JSON.parse(jsonStr) } catch (e) {}
    if (!list.length) {
      box.innerHTML = '<div class="ver" style="color:var(--danger)">未获取到项目（可能需要代理，或 token 无权限）</div>'
      return
    }
    box.innerHTML = '<div class="row">' + list.map(p =>
      '<button class="small ghost" data-name="' + p.name + '">' + p.name + '</button>').join('') + '</div>'
    box.querySelectorAll('button').forEach(b => {
      b.onclick = () => {
        document.getElementById('vc-project').value = b.dataset.name
        box.querySelectorAll('button').forEach(x => x.classList.remove('primary'))
        b.classList.add('primary')
      }
    })
  }

  document.getElementById('btn-projects').onclick = () => {
    const b = document.getElementById('btn-projects')
    b.disabled = true
    try {
      Native.saveConfig('vercelToken', document.getElementById('vc-token').value.trim())
      Native.saveConfig('proxyHost', document.getElementById('px-host').value.trim())
      Native.saveConfig('proxyPort', document.getElementById('px-port').value.trim())
      window.__stage('获取项目列表…')
      Native.listProjects()
    } catch (e) { window.__log('调用失败: ' + e) }
    setTimeout(() => { b.disabled = false }, 1500)
  }

  let editingPath = ''
  const edBox = document.getElementById('editor')
  const edText = document.getElementById('ed-text')
  const edPathEl = document.getElementById('ed-path')

  document.getElementById('btn-theme').onclick = () => {
    const box = document.getElementById('theme-files')
    if (box.style.display === 'block') { box.style.display = 'none'; return }
    try {
      const list = JSON.parse(Native.listThemeFiles())
      box.innerHTML = list.map(f =>
        '<button class="ghost" data-path="' + f.path + '">' +
        f.path.replace('src/', '') + ' <span style="color:var(--muted);font-weight:400">' +
        Math.round(f.size / 1024) + 'KB</span></button>').join('')
      box.querySelectorAll('button').forEach(b => {
        b.onclick = () => openEditor(b.dataset.path)
      })
      box.style.display = 'block'
    } catch (e) { window.__log('读取文件列表失败: ' + e) }
  }

  function openEditor(path) {
    editingPath = path
    edPathEl.textContent = path
    edText.value = Native.readThemeFile(path)
    edBox.style.display = 'flex'
  }

  document.getElementById('ed-close').onclick = () => {
    edBox.style.display = 'none'
  }

  document.getElementById('ed-save').onclick = () => {
    const r = Native.writeThemeFile(editingPath, edText.value)
    window.__stage(r === 'ok' ? '✓ 已保存，记得重新构建' : r)
    if (r === 'ok') edBox.style.display = 'none'
  }

  document.getElementById('btn-create').onclick = () => {
    const name = document.getElementById('vc-project').value.trim()
    if (!name) { window.__stage('先在项目名输入框填一个名字'); return }
    try {
      Native.saveConfig('vercelToken', document.getElementById('vc-token').value.trim())
      Native.saveConfig('proxyHost', document.getElementById('px-host').value.trim())
      Native.saveConfig('proxyPort', document.getElementById('px-port').value.trim())
      window.__stage('创建项目 ' + name + ' …')
      Native.createProject(name)
    } catch (e) { window.__log('调用失败: ' + e) }
  }

  window.__projectCreated = (name) => {
    document.getElementById('vc-project').value = name
    document.getElementById('btn-deploy').disabled = false
  }

  document.getElementById('btn-save').onclick = () => {
    try {
      Native.saveConfig('vercelToken', document.getElementById('vc-token').value.trim())
      Native.saveConfig('vercelProject', document.getElementById('vc-project').value.trim())
      Native.saveConfig('proxyHost', document.getElementById('px-host').value.trim())
      Native.saveConfig('proxyPort', document.getElementById('px-port').value.trim())
      window.__log('配置已保存')
      window.__stage('配置已保存')
    } catch (e) { window.__log('保存失败: ' + e) }
  }

  document.getElementById('btn-push').onclick = () => {
    const b = document.getElementById('btn-push')
    b.disabled = true
    logEl.textContent = ''
    try {
      Native.saveConfig('ghToken', document.getElementById('gh-token').value.trim())
      Native.saveConfig('ghRepo', document.getElementById('gh-repo').value.trim())
      Native.saveConfig('ghBranch', document.getElementById('gh-branch').value.trim() || 'main')
      window.__stage('开始推送…')
      Native.pushToGitHub()
    } catch (e) { window.__log('调用失败: ' + e) }
    setTimeout(() => { b.disabled = false }, 3000)
  }

  document.getElementById('btn-deploy').onclick = () => {
    const b = document.getElementById('btn-deploy')
    b.disabled = true
    logEl.textContent = ''
    try { Native.deployVercel() } catch (e) { window.__log('调用失败: ' + e); b.disabled = false }
  }

  window.__deployDone = (url) => {
    const b = document.getElementById('btn-deploy')
    b.disabled = false
    window.__log('发布完成: ' + url)
    if (confirm) { /* noop */ }
  }

  btnPreview.onclick = () => {
    btnPreview.disabled = true
    try {
      Native.preview()
      const url = Native.previewUrl()
      setTimeout(() => { window.location.href = url }, 700)
    } catch (e) { window.__log('预览失败: ' + e); btnPreview.disabled = false }
  }

  btnBuild.onclick = () => {
    btnBuild.disabled = true
    btnPreview.disabled = true
    logEl.textContent = ''
    window.__stage('开始构建…')
    try { Native.build() } catch (e) { window.__log('调用失败: ' + e); btnBuild.disabled = false }
  }

  try { document.getElementById('ver-text').textContent = '版本 ' + Native.version() } catch (e) {}
  try { Native.ensureEnv() } catch (e) {
    document.getElementById('splash-stage').textContent = '调用失败: ' + e
  }
</script>
</body>
</html>

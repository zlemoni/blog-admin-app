name: build-apk

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签（留空则只上传 artifact）"
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 获取构建载荷
        run: |
          set -e
          if [ -z "${{ vars.PAYLOAD_URL }}" ]; then echo "缺少 PAYLOAD_URL"; exit 1; fi
          mkdir -p app/src/main/assets app/src/main/jniLibs/arm64-v8a
          echo "下载 payload…"
          curl -L --retry 3 --max-time 1800 -o app/src/main/assets/payload.tar.gz "${{ vars.PAYLOAD_URL }}"
          ls -lh app/src/main/assets/payload.tar.gz
          if [ -n "${{ vars.PROOT_URL }}" ]; then
            echo "下载 proot…"
            curl -L --retry 3 --max-time 300 -o app/src/main/jniLibs/arm64-v8a/libproot.so "${{ vars.PROOT_URL }}"
            chmod +x app/src/main/jniLibs/arm64-v8a/libproot.so
            ls -lh app/src/main/jniLibs/arm64-v8a/libproot.so
          fi

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: blog-admin-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true

name: build-apk

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签（留空则只上传 artifact）"
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 准备签名
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/blog.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/blog.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "已启用固定签名"
          else
            echo "无签名密钥，使用默认 debug 签名"
          fi

      - name: 内置运行环境
        run: |
          set -e
          mkdir -p app/src/main/assets
          echo "下载完整包到 assets…"
          curl -L --retry 5 --retry-all-errors --retry-delay 3 --max-time 1800 \
            -o app/src/main/assets/payload.tar.gz \
            "https://github.com/zlemoni/blog-admin-app/releases/download/payload-v2/payload-v2.tar.gz"
          ls -lh app/src/main/assets/payload.tar.gz
          # 校验是不是 gzip（防止下到 HTML 错误页）
          head -c 2 app/src/main/assets/payload.tar.gz | od -An -tx1 | tr -d ' \n' | grep -q "1f8b"
          echo "gzip 校验通过"

      - name: Build APK
        env:
          # 依赖下载重试，规避 Maven Central 偶发 429
          GRADLE_OPTS: "-Dorg.gradle.internal.repository.max.retries=8 -Dorg.gradle.internal.repository.initial.backoff=2000"
        run: gradle assembleDebug --no-daemon --stacktrace --max-workers=2

      - uses: actions/upload-artifact@v4
        with:
          name: blog-admin-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          draft: false
